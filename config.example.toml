# seele settings. Copy to ~/.config/seele/config.toml and `chmod 600` it (it holds the bot token).

# Bot token from https://discord.com/developers/applications → your app → Bot → Reset Token.
# DISCORD_TOKEN in the environment wins over this.
token = ""

# Discord user IDs allowed to use the bot. Empty = the application's owner (or team members).
owners = []

# Servers whose slash commands should update instantly (global ones can take a few minutes).
guilds = []

# Command for /cost (prints a table; gets `-d DAYS`). Empty = `cost` on PATH, if any.
cost_command = ""

# Largest file /get uploads, in MB (Discord's limit for bots is 10 unless the server is boosted).
max_upload_mb = 10

# Names Claude sees for each user (every prompt starts with "[Discord message from NAME]").
# Missing users fall back to their Discord display name.
[people]
# 123456789012345678 = "Alice"

[claude]
binary = "claude"
default_cwd = "~"            # where new conversations start
projects_root = "~/Projects" # what /cd suggests
model = ""                   # empty = Claude Code's default; a full id (claude-opus-5-5) pins it (aliases like opus may pick a [1m] variant)
effort = ""                  # empty = Claude Code's saved default (/effort)
permission_mode = "auto"     # auto | acceptEdits | plan | bypassPermissions
settings_file = "~/.claude/settings.json"  # where `/effort ... everywhere:True` saves the default
# system_prompt = "..."      # appended to Claude Code's own; the default explains it's on Discord
live_input = true            # messages sent while Claude works go straight into the running session

# Extra environment for Claude Code runs (for example to silence your own hooks).
[claude.env]
# NOTIFY_DONE = "0"

# Opt-in Codex chats. Mentions in listed channels open fresh threads.
# Follow-ups inside a thread continue its session.
[codex]
channels = []                # e.g. ["codex"] when [channels] names that channel
binary = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"

# Claude accounts. The first one is the default; `paths` pick an account by working folder.
# Leave this out to use whatever `claude` uses.
[accounts.claude]
config_dir = "~/.claude"

# [accounts.claude2]
# config_dir = "~/.claude-2"
# paths = ["~/Projects/some-project"]
# effort = "xhigh"           # default effort for this account (a conversation's /effort wins)

# An account that pays from API credit (Console login or API key) instead of a plan: no 5-hour or weekly
# limits, so /usage shows what SEELE counted it spending against `budget`, and runs stop there.
# [accounts.claude-api]
# config_dir = "~/.claude-api"
# billing = "api"
# budget = 200               # USD of credit (0 = no budget, just count)
# max_run_usd = 40           # --max-budget-usd per Claude Code process (0 = only the budget)
# spent = 0                  # spend from before SEELE counted, to start the total from

# Machines that run Claude Code. Without [hosts] everything runs on this machine. With them, each
# conversation picks one with /host (new ones use default_host); prompts go there over SSH (key
# login, ~/.ssh/config aliases) and a machine with a `mac` is woken with Wake-on-LAN first.
# The machine the bot runs on is always a host too, named host_name, with the [claude] settings.
# host_name = "server"       # this machine (default: its hostname)
# default_host = "desktop"
# [hosts.desktop]
# ssh = "desktop"            # ssh destination: alias or user@address
# mac = "aa:bb:cc:dd:ee:ff"  # Wake-on-LAN (leave out: a sleeping machine is reported, not woken)
# broadcast = "255.255.255.255"
# home = "/home/me"          # its home folder (asked over SSH when left out)
# default_cwd = "~"
# projects_root = "~/Projects"
# binary = "claude"          # found on the machine's PATH plus ~/.local/bin
# wake_timeout = 240         # seconds to wait for it to boot
# ssh_binary / ssh_options per host override [ssh] below.
# [ssh]
# binary = "ssh"             # default: ssh; on Windows Git for Windows' ssh.exe (the system's
#                            # OpenSSH doesn't pass piped input on); put -F PATH in options if your
#                            # aliases live in a file it doesn't read
# options = ["-F", "C:/Users/me/.ssh/config"]
# The machine needs bash, python3 and a logged-in `claude`. Account config_dir/paths above are
# read on whichever machine runs the prompt; usage_host = "desktop" says where /usage reads a login.

# On a machine that only has the CLI (the bot runs elsewhere): send `seele conv` / `seele prompt`
# to the bot over SSH. `command` is the seele CLI on that machine.
# [bot]
# ssh = "server"
# command = 'C:\Users\me\.local\share\seele\venv\Scripts\seele.exe'

# While this process runs, Claude is told to keep it light (e.g. a game on the same machine).
[guard]
process = ""
note = "A game is running on this machine right now: avoid heavy local work (builds, test suites, big downloads) unless asked."

# Names for channels, used by the CLI: `seele post --channel progress`, `seele conv --id lead`,
# `--agents-channel agents`. Values are channel or thread ids.
[channels]
# codex = 123456789012345678
# lead = 123456789012345678
# progress = 123456789012345678
# agents = 123456789012345678
